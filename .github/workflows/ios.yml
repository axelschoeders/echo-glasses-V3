
name: ECHO iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check project
        working-directory: ios-companion
        run: |
          xcodegen generate
          test -f EchoGlasses.xcodeproj/project.pbxproj

      - name: Build iOS
        working-directory: ios-companion
        run: |
          set -o pipefail
          xcodebuild \
            -project EchoGlasses.xcodeproj \
            -scheme EchoGlasses \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ECHO-iOS-build
          path: ios-companion/build/Build/Products/Release-iphoneos/
